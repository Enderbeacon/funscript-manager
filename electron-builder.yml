appId: com.funscriptmanager.desktop
productName: Funscript Manager
directories:
  buildResources: build
  output: release
files:
  - out/**
  - "!out/types-*/**"
  # Shipped beside the executable instead (extraFiles), readable without the app.
  - "!out/main/THIRD_PARTY_LICENSES.txt"
# Next to Electron's own LICENSE.electron.txt and LICENSES.chromium.html, so
# every license that comes with the app is in one folder.
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
  - from: out/main/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
asarUnpack:
  - resources/bin/**
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/mfp-plugin
    to: mfp-plugin
    filter:
      - "**/*"
  - from: resources/vr-overlay
    to: vr-overlay
    filter:
      - "**/*"
# Only the unpacked folder: the installer, the portable zip and the update
# packages are built from it by scripts/release.mjs.
win:
  icon: build/icon.ico
  target:
    - dir
npmRebuild: true
