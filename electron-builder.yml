appId: com.funscriptmanager.desktop
productName: Funscript Manager
directories:
  buildResources: build
  output: release
files:
  - out/**
  - "!out/types-*/**"
asarUnpack:
  - resources/bin/**
  # ffmpeg-static ships its binary inside node_modules; a child process cannot
  # be spawned from inside the asar archive, so it has to live on disk.
  - node_modules/ffmpeg-static/**
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/mfp-plugin
    to: mfp-plugin
    filter:
      - "**/*"
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
npmRebuild: true
